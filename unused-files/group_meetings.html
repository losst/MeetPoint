<!DOCTYPE html>
<html>

<head>
    <title>Group Meetings</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/group_meetings_style.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>


<body>
<div class="group-page">

    <!-- side bar-->
    <aside class="sidebar">
        <a href="appointments.html">
            <button class="sidebar-btn logo" title="Appointments">
                <img src="assets/logo.png" alt="Appointments" />
            </button>
        </a>

        <a href="slots_owner.html">
            <button class="sidebar-btn" title="Home">
                <img src="assets/home_icon.png" alt="Home" />
            </button>
        </a>
        
        <a href="notifications.html">
            <button class="sidebar-btn" title="Notifications">
                <img src="assets/chat_icon.png" alt="notifications" />
            </button>
        </a>

        <a href="group_meetings.html">
            <button class="sidebar-btn active" title="Group Meetings">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">
                    <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                </svg>
            </button>
        </a>

        <a href="slots.html">
            <button class="sidebar-btn" title="Slots">
                <img src="assets/calendar_icon.png" alt="Slots" />
            </button>
        </a>

        <!-- for smaller screens -->
        <a href="javascript:void(0);" class="bar-icon" id="bar-icon" onclick="openSidebar()">
            <!-- bootstrap svg -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
            </svg>
        </a>
        
    </aside>

    <div class="group-main">
        <!-- title + logout -->
        <header class="group-header">
            <h1>GROUP MEETINGS</h1>
            <button class="logout-btn" type="button">
				<img src="assets/profile.png" alt="Profile" class="profile-icon" />
				<span>LOG OUT</span>
			</button>
        </header>

        <div class="content">
        <!-- left side -->
            <section class="group-list">
                <!-- these need to be queried -->
                <div class="group-row filter">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

                <div class="group-row">
                    <span class="group_id" style="display: none;">1</span>
                    <span class="group-name">NAME</span>
                    <div class="group-actions">
                        <img src="assets/calendar_icon.png" />
                        <img src="assets/chat_icon.png" />
                    </div>
                </div>

            </section>
			
        

            <!-- right side -->
            <!-- Calendar, referenced Bootstrap -->
            <section class="calendar-container">
                <div class="calendar">
                    <div class="year-header">
                        <span class="left-button fa fa-chevron-left" id="prev""></span>
                        <span class="year" id="label"></span>
                        <span class="right-button fa fa-chevron-right" id="next"> </span>
                    </div>
                    <table class="months-table wide">
                        <tbody>
                            <tr class="months-row">
                                <td class="month">Jan</td>
                                <td class="month">Feb</td>
                                <td class="month">Mar</td>
                                <td class="month">Apr</td>
                                <td class="month">May</td>
                                <td class="month">Jun</td>
                                <td class="month">Jul</td>
                                <td class="month">Aug</td>
                                <td class="month">Sep</td>
                                <td class="month">Oct</td>
                                <td class="month">Nov</td>
                                <td class="month">Dec</td>
                            </tr>
                        </tbody>
                    </table>

                    <table class="days-table wide">
                        <td class="day">SUN</td>
                        <td class="day">MON</td>
                        <td class="day">TUE</td>
                        <td class="day">WED</td>
                        <td class="day">THU</td>
                        <td class="day">FRI</td>
                        <td class="day">SAT</td>
                    </table>
                    <div class="frame">
                        <table class="dates-table wide" cellspacing="0">
                            <tbody class="tbody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="events">
                    <div class="events-container show-form">
                        <!-- testing purposes -->
                        <div class="event" title="select">
                            <span class="event-time">time</span>
                            <span class="event-recur">recurring</span>
                            <span class="event-status">votes: </span> <!-- if owner -->
                        </div>
                        <div class="event" title="vote" onclick="testVote()">
                            <span class="event-time">time</span>
                            <span class="event-recur">recurring</span>
                            <span class="event-status"></span>
                        </div>
                        <div class="event voted" onclick="testVote()">
                            <span class="event-time">time</span>
                            <span class="event-recur">recurring</span>
                            <span class="voted-status">voted</span>
                        </div>
                        <div class="event">
                            <span class="event-time">time</span>
                            <span class="event-recur">recurring</span>
                            <span class="event-status">votes: </span>
                        </div>
                        <div class="event">
                            <span class="event-time">time</span>
                            <span class="event-recur">recurring</span>
                            <span class="event-status">votes: </span>
                        </div>

                        <div class="set-recurrence-form">
                            <span class="close">&times;</span>
                            <form class="form-main">
                                <input type="hidden" name="group-id" id="group-id">
                                <input type="hidden" name="meeting-id" id="meeting-id">
                                <input type="hidden" name="meeting-time" id="meeting-time">
                                <div class="form-content">
                                    <label class="form-title" for="repeat-weeks">REPEAT FOR</label>
                                    <input type="number" id="repeat-weeks" name="repeat-weeks" min="1" max="16" value="8" style="text-align: center;">
                                    <span class="inline-label">WEEKS</span>
                                </div>
                                <button class="confirm-btn">Confirm</button>
                            </form>
                        </div>
                        

                    </div>
                </div>
				
				<div class="group-actions-footer">
					<a href="group_meeting_options.html" class="add-group-meeting-btn">
						<img src="assets/add_icon.png" alt="Add group meeting" class="add-icon" />
						<span>ADD GROUP MEETING</span>
					</a>
				</div>
                
            </section>
        </div>
    </div>
</div>

<script src="js/jquery.min.js"></script>
<script src="js/calendar.js"></script>
<script src="js/group_meetings.js"></script>
<script src="js/script.js"></script>

<script>
    function testVote() {
        if (event.currentTarget.classList.contains('voted')) {
            return; 
        }

        const overlay = document.createElement("span");
        overlay.className = "voted-status";
        overlay.textContent = "Voted ✓";
        event.currentTarget.append(overlay);

        event.currentTarget.className += " voted";
    }
    
</script>

</body>
</html>
